[project]
name = "ai-engineer-journey"
version = "0.1.0"
description = "A 24-week production AI systems engineering roadmap covering FastAPI, Pydantic V2, Docker, Hybrid RAG with pgvector, and Model Context Protocol (MCP) agents."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["weeks"]